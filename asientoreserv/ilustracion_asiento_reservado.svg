  <text x="240" y="170" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1.5" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:auto">RESERVADO</text>

